<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>미국 ETF 투자법 강의</title>
  <meta name="description" content="포메뽀꼬의 누구나 성공할 수 있는 미국 ETF 투자법 강의 랜딩페이지">

  <!-- 웹폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">

  <!-- 스타일 -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header / Body / Footer는 js/script.js가 html/ 폴더에서 불러와 이 자리에 넣습니다 -->
  <div id="site-header"></div>
  <div id="site-body"></div>
  <div id="site-footer"></div>

  <noscript><p style="padding:24px">이 페이지는 JavaScript가 필요합니다.</p></noscript>

  <!-- 애니메이션 라이브러리: CDN 우선, 인터넷이 없으면 로컬 사본 사용 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script>
    window.gsap || document.write('<script src="js/vendor/gsap.min.js"><\/script>');
  </script>
  <script>
    window.ScrollTrigger || document.write('<script src="js/vendor/ScrollTrigger.min.js"><\/script>');
  </script>

  <!-- file:// 실행용 예비 사본 → 메인 스크립트 -->
  <script src="js/partials.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
